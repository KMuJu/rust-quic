[package]
name = "rust-quic"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.11.1"
futures = "0.3.32"
rand = "0.10.0"
range-set = "0.1.0"
rustls = "0.23.40"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
rustls-pki-types = "1"
webpki-roots = "0.26"   # or rustls-native-certs for system roots
rcgen = "0.13"
rustls-pemfile = "2.2.0"
